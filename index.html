<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>New Tab</title>
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/app.css" />
  </head>

  <body>
    <a class="skip" href="#work">Skip to your work</a>

    <div class="page">
      <header class="masthead">
        <div class="hello">
          <p class="hello__date" id="date">&nbsp;</p>
          <h1 class="hello__greeting" id="greeting">&nbsp;</h1>
          <p class="hello__summary" id="summary">&nbsp;</p>
          <p class="hello__ai" id="hello-ai" hidden></p>
        </div>
        <div class="tools" id="tools"></div>
      </header>

      <div class="search" id="search">
        <label class="search__box">
          <span class="search__icon" data-icon="search"></span>
          <input
            id="search-input"
            type="text"
            role="combobox"
            aria-label="Search PRs, issues, links and actions"
            aria-expanded="false"
            aria-controls="search-results"
            aria-autocomplete="list"
            placeholder="Search your PRs, issues and links"
            autocomplete="off"
            spellcheck="false"
          />
          <kbd class="search__kbd" aria-hidden="true">/</kbd>
        </label>
        <ul class="search__results" id="search-results" role="listbox" aria-label="Search results" hidden></ul>
      </div>

      <nav class="repos" id="repos" aria-label="Repositories and links"></nav>

      <main class="layout">
        <section class="panel work" id="work" tabindex="-1" aria-label="Your work"></section>
        <aside class="side">
          <section class="panel today" id="today" aria-label="Today"></section>
        </aside>
      </main>
    </div>

    <div id="repo-menus"></div>
    <aside class="drawer" id="activity" popover aria-label="Activity"></aside>
    <dialog class="sheet" id="settings" aria-label="Settings"></dialog>
    <dialog class="sheet bob" id="ai" aria-label="Bob"></dialog>
    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script src="bookmarks-data.js"></script>
    <script src="js/core.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/repos.js"></script>
    <script src="js/github.js"></script>
    <script src="js/insights.js"></script>
    <script src="js/demo.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>

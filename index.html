<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>New Tab</title>
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <script src="src/page/theme.js"></script>
    <link rel="stylesheet" href="src/vendor/carbon/carbon.css" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <cds-header aria-label="Dev Dashboard">
      <cds-skip-to-content href="#work"></cds-skip-to-content>
      <cds-header-name prefix="Carbon">Dev Dashboard</cds-header-name>
      <div class="cds--header__global" id="tools"></div>
      <cds-header-panel id="activity" aria-label="Activity"></cds-header-panel>
    </cds-header>

    <cds-grid class="page" full-width>
      <cds-column class="masthead" sm="4" md="8" lg="16">
        <div class="hello">
          <p class="cds--type-label-01 hello__date" id="date">&nbsp;</p>
          <h1 class="cds--type-heading-05 hello__greeting" id="greeting">&nbsp;</h1>
          <p class="cds--type-body-01 hello__summary" id="summary">&nbsp;</p>
          <p class="hello__ai" id="hello-ai" hidden></p>
        </div>
        <div class="masthead__sync" id="sync"></div>
      </cds-column>

      <cds-column class="search" id="search" sm="4" md="8" lg="16">
        <cds-search id="search-input" size="lg" label-text="Search your PRs, issues and links" placeholder="Search your PRs, issues and links" autocomplete="off"></cds-search>
        <cds-layer class="search__results" id="search-results" hidden></cds-layer>
      </cds-column>

      <cds-column class="repos" sm="4" md="8" lg="16">
        <nav class="repos__bar" id="repos" aria-label="Repositories and links"></nav>
      </cds-column>

      <cds-column class="work-column" sm="4" md="8" lg="11">
        <cds-layer class="panel work" with-background id="work" tabindex="-1" aria-label="Your work"></cds-layer>
      </cds-column>
      <cds-column class="side" sm="4" md="8" lg="5">
        <cds-layer class="panel today" with-background id="today" aria-label="Today"></cds-layer>
      </cds-column>
    </cds-grid>

    <cds-modal id="settings" size="md" aria-label="Settings"></cds-modal>
    <cds-modal id="repo-editor" size="lg" aria-label="Edit repositories"></cds-modal>
    <cds-modal id="ai" size="lg" aria-label="Bob"></cds-modal>
    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script src="src/vendor/prism.js" data-manual></script>
    <script type="module" src="src/page/main.js"></script>
  </body>
</html>
